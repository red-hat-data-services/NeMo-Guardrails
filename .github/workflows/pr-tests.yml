name: PR Tests

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".github/**"

jobs:
  pr-tests-matrix:
    strategy:
      matrix:
        os: [Ubuntu]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: Ubuntu
            image: ubuntu-latest
          - python-version: "3.11"
            with-coverage: true
      fail-fast: false
    uses: ./.github/workflows/_test.yml
    secrets: inherit
    with:
      os: ${{ matrix.os }}
      image: ${{ matrix.image }}
      python-version: ${{ matrix.python-version }}
      with-coverage: ${{ matrix.with-coverage || false }}

  downstream-requirements-test:
    name: Ubuntu / Python 3.12 / requirements.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Create virtual environment
        run: uv venv .venv

      - name: Install runtime and test dependencies
        run: |
          . .venv/bin/activate
          uv pip install -r requirements.txt
          uv pip install -e . --no-deps
          uv pip install pytest pytest-asyncio pytest-cov pytest-httpx aioresponses opentelemetry-sdk

      - name: Run pytest
        run: |
          . .venv/bin/activate
          python -m pytest -v

  pr-tests-summary:
    name: PR Tests Summary
    needs: [pr-tests-matrix, downstream-requirements-test]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all PR tests passed
        run: echo "All PR Tests completed successfully"
